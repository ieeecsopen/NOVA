name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Conformance & Master Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Clang & LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Run Master Verification Suite
        run: ./tools/check-all.sh
